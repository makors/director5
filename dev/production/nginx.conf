server {
    listen 80;
    server_name _;
    location /static/ {
        alias /static/;
        add_header Cache-Control "public, max-age=3600";
        autoindex off;
    }
    location /media/ {
        alias /media/;
        add_header X-Content-Type-Options nosniff always;
        autoindex off;
    }
    location / { return 404; }
}
