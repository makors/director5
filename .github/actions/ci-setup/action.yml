name: CI setup
description: Install the dependencies needed for ci

inputs:
  group:
    description: The dependency group to install (blank for all).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.x"
        python-version: 3.13

    - name: Install dependencies
      shell: bash
      env:
        CI_DEPENDENCY_GROUP: ${{ inputs.group }}
      run: |
        if [ -n "$CI_DEPENDENCY_GROUP" ]; then
          exec uv sync --frozen --all-packages --no-default-groups --group "$CI_DEPENDENCY_GROUP"
        fi
        exec uv sync --frozen --all-packages
