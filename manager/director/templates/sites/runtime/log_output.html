{% if error %}
  <p class="dt-log-message" role="status">{{ error }}</p>
{% else %}
  <pre class="dt-runtime-output">{% if output %}{{ output }}{% else %}<span class="dt-muted">No log output yet.</span>{% endif %}</pre>
  {% if truncated %}<p class="dt-muted">Output was truncated at 64 KiB.</p>{% endif %}
{% endif %}
