<div class="dt-form-field">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label for="{{ field.id_for_label }}" class="flex items-start gap-3 py-3">
      {{ field }} <span>{{ field.label }}</span>
    </label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="dt-muted">(optional)</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p id="{{ field.auto_id }}_helptext" class="dt-muted">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}
    <ul id="{{ field.auto_id }}_error" class="dt-error-list" role="alert">
      {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  {% endif %}
</div>
